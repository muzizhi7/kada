name: Bug report / 问题反馈
description: Report a reproducible problem using sanitized inputs.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not attach .env, tokens, raw sessions or private files. For vulnerabilities use SECURITY.md."
  - type: input
    id: environment
    attributes:
      label: Version and environment / 版本与环境
      description: Kada commit/tag, OS, Node version, CLI or macOS companion.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and minimal synthetic input / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error, checks, corrections and estimated cost / 脱敏证据
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隐私
      options:
        - label: I removed credentials, private task material and raw sessions.
          required: true
