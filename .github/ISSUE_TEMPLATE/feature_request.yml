name: Feature request / 改进建议
description: Explain a real task and the outcome you need.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: Task and missing outcome / 真实任务与缺失结果
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior and current workaround / 期望行为与当前做法
  - type: textarea
    id: success
    attributes:
      label: How would you verify improvement? / 如何判断改善？
