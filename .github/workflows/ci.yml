name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/cases/requirements.txt
      - run: python -m pip install -r scripts/cases/requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - if: runner.os == 'macOS'
        run: npm run pet -- --build
      # Interactive pet smoke and paid model studies run explicitly on a developer machine.
